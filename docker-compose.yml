networks:
  network-financegrid:
    driver: bridge

x-base-env: &base-env
  - ASPNETCORE_ENVIRONMENT=Development
  - ASPNETCORE_URLS=http://+:80

x-base-volumes: &base-volumes
  rabbitmq_data: /data

services:
  frontend:
    container_name: financegrid
    env_file: .env.example
    environment:
      - ANGULAR_BUILD_CONFIGURATION=development
    ports:
      - "4200:80"
    volumes:
      - .:/app
      - /app/node_modules
    restart: always
    depends_on:
      - gateway
    build:
      context: ./FinanceGrid.WebClient
      dockerfile: Dockerfile
    networks:
      - network-financegrid

  gateway:
    container_name: gateway
    env_file: .env.example
    environment: *base-env
    ports:
      - "5000:80"
    depends_on:
      - financialdata-service
      - users-service
      - webhook-service
    build:
      context: .
      dockerfile: ./FinanceGrid/FinanceGrid.Gateway/Dockerfile
    networks:
      - network-financegrid

  financialdata-service:
    container_name: financialdata-service
    env_file: .env.example
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Database__Provider=${DatabaseProvider:-SQLite}
      - Database__ConnectionString=${FINANCIALDATA_CONNECTION_STRING:-}
    ports:
      - "5001:80"
    volumes:
      - financialdata_data:/data
    depends_on:
      - rabbitmq
    build:
      context: .
      dockerfile: ./FinanceGrid/FinancialData/FinanceGrid.FinancialData.Api/Dockerfile
    networks:
      - network-financegrid

  users-service:
    container_name: users-service
    env_file: .env.example
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Database__Provider=${DatabaseProvider:-SQLite}
      - Database__ConnectionString=${USERS_CONNECTION_STRING:-}
    ports:
      - "5002:80"
    volumes:
      - users_data:/data
    build:
      context: .
      dockerfile: ./FinanceGrid/Users/FinanceGrid.Users.Api/Dockerfile
    networks:
      - network-financegrid

  webhook-service:
    container_name: webhook-service
    env_file: .env.example
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Database__Provider=${DatabaseProvider:-SQLite}
      - Database__ConnectionString=${WEBHOOK_CONNECTION_STRING:-}
    ports:
      - "5003:80"
    volumes:
      - webhook_data:/data
    depends_on:
      - rabbitmq
    build:
      context: .
      dockerfile: ./FinanceGrid/Webhook/FinanceGrid.Webhook.Api/Dockerfile
    networks:
      - network-financegrid

  webhook-processing:
    container_name: webhook-processing
    env_file: .env.example
    environment:
      - DOTNET_ENVIRONMENT=Development
      - Database__Provider=${DatabaseProvider:-SQLite}
      - Database__ConnectionString=${WEBHOOK_CONNECTION_STRING:-}
    volumes:
      - webhook_data:/data
    depends_on:
      - rabbitmq
    restart: always
    build:
      context: .
      dockerfile: ./FinanceGrid/Webhook/FinanceGrid.Webhook.Processing/Dockerfile
    networks:
      - network-financegrid

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    env_file: .env.example
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - network-financegrid

  postgres:
    image: postgres:15
    container_name: postgres
    env_file: .env.example
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-financegrid}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-financegrid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - network-financegrid
    profiles:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financialdata_data:
  users_data:
  webhook_data:
  postgres_data:
