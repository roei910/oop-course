networks:
  network-financegrid:
    driver: bridge

services:
  frontend:
    container_name: financegrid
    environment:
      - ANGULAR_BUILD_CONFIGURATION=development
    ports:
      - "4200:80"
    volumes:
      - .:/app
      - /app/node_modules
    restart: always
    depends_on:
      - gateway
    build:
      context: ./FinanceGrid.WebClient
      dockerfile: Dockerfile
    networks:
      - network-financegrid

  gateway:
    container_name: gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "5000:80"
    depends_on:
      - financialdata-service
      - users-service
      - webhook-service
    build:
      context: .
      dockerfile: ./FinanceGrid/FinanceGrid.Gateway/Dockerfile
    networks:
      - network-financegrid

  financialdata-service:
    container_name: financialdata-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DatabaseProvider=${DATABASE_PROVIDER:-SQLite}
      - ConnectionStrings__FinancialData=${FINANCIALDATA_CONNECTION_STRING:-Data Source=/data/FinancialData.db}
    ports:
      - "5001:80"
    volumes:
      - financialdata_data:/data
    depends_on:
      - rabbitmq
    build:
      context: .
      dockerfile: ./FinanceGrid/FinancialData/FinanceGrid.FinancialData.Api/Dockerfile
    networks:
      - network-financegrid

  users-service:
    container_name: users-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DatabaseProvider=${DATABASE_PROVIDER:-SQLite}
      - ConnectionStrings__Users=${USERS_CONNECTION_STRING:-Data Source=/data/Users.db}
    ports:
      - "5002:80"
    volumes:
      - users_data:/data
    build:
      context: .
      dockerfile: ./FinanceGrid/Users/FinanceGrid.Users.Api/Dockerfile
    networks:
      - network-financegrid

  webhook-service:
    container_name: webhook-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DatabaseProvider=${DATABASE_PROVIDER:-SQLite}
      - ConnectionStrings__Webhook=${WEBHOOK_CONNECTION_STRING:-Data Source=/data/Webhook.db}
    ports:
      - "5003:80"
    volumes:
      - webhook_data:/data
    depends_on:
      - rabbitmq
    build:
      context: .
      dockerfile: ./FinanceGrid/Webhook/FinanceGrid.Webhook.Api/Dockerfile
    networks:
      - network-financegrid

  webhook-processing:
    container_name: webhook-processing
    environment:
      - DOTNET_ENVIRONMENT=Development
      - DatabaseProvider=${DATABASE_PROVIDER:-SQLite}
      - ConnectionStrings__Webhook=${WEBHOOK_CONNECTION_STRING:-Data Source=/data/Webhook.db}
    volumes:
      - webhook_data:/data
    depends_on:
      - rabbitmq
    restart: always
    build:
      context: .
      dockerfile: ./FinanceGrid/FinanceGrid.Webhook.Processing/Dockerfile
    networks:
      - network-financegrid

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - network-financegrid

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-financegrid}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-financegrid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-financegrid
    profiles:
      - postgres

volumes:
  financialdata_data:
  users_data:
  webhook_data:
  postgres_data:
